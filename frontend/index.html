<!DOCTYPE html>
<html>
<head>
  <title>GusKitchenAI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    #output {
      margin-bottom: 20px;
    }

    .section {
      margin-top: 30px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .sidebar {
      width: 80px;
      background: #222;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    .sidebar button {
      margin: 10px;
      padding: 10px;
      background: #444;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .sidebar button:hover {
      background: #666;
    }
  </style>
</head>

<body>
  <div style="display: flex; height: 100vh;">

    <!-- Main Content -->
    <div style="flex: 1; padding: 20px; overflow-y: auto;">
      <h1 id="clock"></h1>
      <p id="output">Loading...</p>

      <div class="section">
        <h2>📅 Calendar</h2>
        <div id="calendar"></div>
      </div>

      <div class="section">
        <h2>🌱 Sprouts</h2>
        <p>Coming soon...</p>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Top -->
      <div>
        <button>🏠</button>
      </div>

      <!-- Bottom -->
      <div>
        <button id="settingsBtn" onclick="openSettings()">⚙️</button>
      </div>
    </div>

  </div>

  <div id="settingsModal" onclick="handleModalClick(event)" style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
  ">
    <div onclick="event.stopPropagation()" style="
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    ">
      <h2>Settings</h2>

      <label>
        Username:
        <input id="usernameInput" type="text" />
      </label>

      <br><br>

      <button onclick="saveSettings()">Save</button>
      <button onclick="closeSettings()">Close</button>
    </div>
  </div>

  <script>
    async function loadHealth() {
      const res = await fetch("/health");
      const data = await res.json();

      document.getElementById("output").innerText =
        data.status === "ok" ? "✅ Backend is running" : "❌ Backend error";
    }

    async function loadCalendar() {
      const res = await fetch("/calendar");
      const data = await res.json();

      const list = document.getElementById("calendar");
      list.innerHTML = "";

      data.forEach(item => {
        const div = document.createElement("div");
        div.className = "card";

        const time = document.createElement("strong");
        time.innerText = item.time;

        const event = document.createElement("p");
        event.innerText = item.event;
        event.style.margin = "5px 0 0 0";

        div.appendChild(time);
        div.appendChild(event);
        list.appendChild(div);
      });
    }

    function handleModalClick(event) {
      closeSettings();
    }

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString();
      document.getElementById("clock").innerText = time;
    }

    function openSettings() {
      loadSettings();
      document.getElementById("settingsModal").style.display = "flex";
    }

    function closeSettings() {
      document.getElementById("settingsModal").style.display = "none";
    }

    async function saveSettings() {
      const username = document.getElementById("usernameInput").value;

      await fetch("/settings", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username: username })
      });

      closeSettings();
    }

    async function loadSettings() {
      const res = await fetch("/settings");
      const data = await res.json();

      document.getElementById("usernameInput").value = data.username || "";
    }

    function init() {
      loadHealth();
      loadCalendar();
      updateClock();
      setInterval(updateClock, 1000);
    }

    window.onload = init;
  </script>
</body>
</html>
