<!DOCTYPE html>
<html>
<head>
  <title>GusKitchenAI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    #output {
      margin-bottom: 20px;
    }

    .section {
      margin-top: 30px;
    }

    .card {
      background:  var(--card-bg);
      color: var(--card-text);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .sidebar {
      width: 80px;
      background: #222;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    .sidebar button {
      margin: 10px;
      padding: 10px;
      background: #444;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .sidebar button:hover {
      background: #666;
    }

    .modal-box {
      background: var(--modal-bg);
      color: var(--modal-text);
    }

    body.light {
      --bg: #f5f5f5;
      --text: #000;
      --card-bg: #fff;
      --card-text: #000;
      --modal-bg: #fff;
      --modal-text: #000;

      background-color: var(--bg);
      color: var(--text);
    }

    body.dark {
      --bg: #121212;
      --text: #fff;
      --card-bg: #1f1f1f;
      --card-text: #fff;
      --modal-bg: #1f1f1f;
      --modal-text: #fff;

      background-color: var(--bg);
      color: var(--text);
    }
  </style>
</head>

<body>
  <div style="display: flex; height: 100vh;">

    <!-- Main Content -->
    <div style="flex: 1; padding: 20px; overflow-y: auto;">
      <div id="dashboardView">
        <h1 id="clock"></h1>
        <h2 id="welcome"></h2>
        <p id="output">Loading...</p>

        <div class="section">
          <h2>📅 Calendar</h2>
          <div id="calendar"></div>
        </div>

        <div class="section">
          <h2>🌱 Sprouts</h2>
          <p>Coming soon...</p>
        </div>
      </div>

      <!-- Sprouts page -->
      <div id="sproutsView" style="display: none;">
        <h1>🌱 Sprout Tracker</h1>

        <button onclick="openAddSprout()">➕ Add Sprout</button>

        <div id="sproutList"></div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Top -->
      <div>
        <button onclick="playClick(); showView('dashboard')">🏠</button>
        <button onclick="playClick(); showView('sprouts')">🌱</button>
      </div>

      <!-- Bottom -->
      <div>
        <button id="settingsBtn" onclick="playClick(); openSettings()">⚙️</button>
      </div>
    </div>

  </div>

  <div id="settingsModal" onclick="handleModalClick(event)" style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
  ">
    <div class="modal-box" onclick="event.stopPropagation()" style="
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    ">
      <h2>Settings</h2>

      <label>
        Username:
        <input id="usernameInput" type="text" />
      </label>

      <br><br>

      <label>
        Theme:
        <select id="themeInput">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>

      <br><br>

      <button onclick="saveSettings()">Save</button>
      <button onclick="closeSettings()">Close</button>
    </div>
  </div>

  <div id="addSproutModal" onclick="handleAddSproutClick(event)" style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
  ">
    <div class="modal-box" onclick="event.stopPropagation()" style="
      padding: 20px;
      border-radius: 10px;
      width: 300px;
    ">
      <h2>New Sprout</h2>

      <label>
        Seed:
        <select id="seedSelect"></select>
      </label>

      <br><br>

      <button onclick="createSprout()">Create</button>
      <button onclick="closeAddSprout()">Cancel</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
